name: centraliza

x-application: &application
  image: centraliza-local:latest
  build: .
  init: true

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: centraliza
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta npm run setup primero}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d centraliza"]
      interval: 3s
      timeout: 3s
      retries: 20

  bootstrap:
    <<: *application
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/centraliza
      DATABASE_URL: postgresql://dashboard_app:${APP_DB_PASSWORD}@db:5432/centraliza
      DEMO_MODE: ${DEMO_MODE:-true}
      JWT_SECRET: ${JWT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *application
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://dashboard_app:${APP_DB_PASSWORD}@db:5432/centraliza
      JWT_SECRET: ${JWT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      DEMO_MODE: ${DEMO_MODE:-true}
      SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-2026-07}
      MOCK_PROVIDERS: ${MOCK_PROVIDERS:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:3001"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
